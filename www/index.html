<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6c5ce7" />
  <title>تحدي العربية - لعبة أسئلة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="logo">تحدي العربية</div>
      <div class="score-pill">النقاط: <span id="score">0</span></div>
    </header>

    <main class="screen" id="screen-home">
      <div class="hero">
        <div class="hero-emoji">🏆</div>
        <h1>تحدي العربية</h1>
        <p>اختبر معلوماتك في اللغة العربية وثقافتها وأدبها عبر أسئلة متنوعة وممتعة!</p>
        <ul class="rules">
          <li>١٠ أسئلة متنوعة الصعوبة</li>
          <li>١٥ ثانية لكل سؤال</li>
          <li>نقطة لكل إجابة صحيحة</li>
        </ul>
        <button class="btn btn-primary" id="btn-start">ابدأ التحدي</button>
      </div>
    </main>

    <main class="screen hidden" id="screen-quiz">
      <div class="progress-row">
        <span id="q-counter">السؤال 1 من 10</span>
        <span id="timer">15</span>
      </div>
      <div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div>
      <div class="timer-track"><div class="timer-bar" id="timer-bar"></div></div>

      <div class="card">
        <h2 id="q-text">...</h2>
        <div class="answers" id="answers"></div>
        <div class="feedback" id="feedback"></div>
        <button class="btn btn-primary hidden" id="btn-next">السؤال التالي</button>
      </div>
    </main>

    <main class="screen hidden" id="screen-result">
      <div class="hero">
        <div class="hero-emoji" id="result-emoji">🎉</div>
        <h2 id="result-title">أحسنت!</h2>
        <p id="result-msg"></p>
        <div class="result-circle">
          <div class="result-score" id="result-score">0</div>
          <div class="result-label">من <span id="result-total">10</span></div>
        </div>
        <div class="result-btns">
          <button class="btn btn-primary" id="btn-replay">العب مجددًا</button>
          <button class="btn btn-ghost" id="btn-home">القائمة الرئيسية</button>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
